name: Apply existing-as-new semantic context
description: Keep a temporary repository alias from changing application semantics

inputs:
  canonical-app:
    description: Canonical upstream application name
    required: true
  target-alias:
    description: Temporary repository and image-name alias
    required: true

runs:
  using: composite
  steps:
    - name: Append the test-only application context
      shell: bash
      env:
        CANONICAL_APP: ${{ inputs.canonical-app }}
        TARGET_ALIAS: ${{ inputs.target-alias }}
      run: |
        set -euo pipefail
        prompt_dir="${GITHUB_WORKSPACE}/.github/agents"
        prompts=(
          image-creator.md
          image-qa.md
          testcase-creator.md
          testcase-qa.md
          code-fixer.md
        )

        for prompt in "${prompts[@]}"; do
          path="${prompt_dir}/${prompt}"
          if [ ! -f "${path}" ]; then
            echo "Agent prompt is missing: ${path}" >&2
            exit 2
          fi
          {
            printf '\n## Existing-as-new test context\n\n'
            printf "The canonical application is \`%s\`.\n\n" "${CANONICAL_APP}"
            printf "\`%s\` is only a temporary repository and image-name alias used to avoid colliding with an existing target path. It is not a separate product, probe, client, or testing utility.\n\n" "${TARGET_ALIAS}"
            printf 'Implement the canonical application itself. The resulting container must run the application and expose its primary application behavior.\n\n'
            printf "Do not create a probe-only, client-only, installer-only, or CLI-only image. File-existence, version-file, and \`--help\` checks are supplementary only.\n\n"
            printf 'Tests must start and validate the candidate image itself. Derive its startup method, dependencies, ports, and readiness behavior from the pinned official upstream source.\n'
          } >> "${path}"
        done
