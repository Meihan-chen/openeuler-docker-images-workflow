name: Watch GitCode new-image Issues

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Exact GitCode Issue number; defaults to repository variable"
        required: false
        type: string
      max_issues:
        description: "Maximum new Issues claimed in one scan run"
        required: false
        type: string
        default: "3"

permissions:
  actions: write
  contents: read

concurrency:
  group: phase1-gitcode-issue-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Claim new image requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate Issue allowlist
        if: github.event_name == 'workflow_dispatch'
        env:
          ISSUE_NUMBER: >-
            ${{ inputs.issue_number || vars.PHASE1_TEST_ISSUE_NUMBER }}
        run: |
          case "${ISSUE_NUMBER}" in
            ''|*[!0-9]*|0)
              echo "PHASE1_TEST_ISSUE_NUMBER must be a positive integer" >&2
              exit 2
              ;;
          esac

      - name: Claim Issues and dispatch scenario one
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: >-
            ${{ inputs.issue_number || vars.PHASE1_TEST_ISSUE_NUMBER }}
          MAX_ISSUES: ${{ inputs.max_issues || '3' }}
        run: |
          case "${MAX_ISSUES}" in
            ''|*[!0-9]*|0)
              echo "max_issues must be a positive integer" >&2
              exit 2
              ;;
          esac
          args=(
            --target-repo openeuler/openeuler-docker-images
            --github-repository "${GITHUB_REPOSITORY}"
            --github-ref "${GITHUB_REF_NAME}"
            --max-issues "${MAX_ISSUES}"
          )
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] &&
             [ -n "${ISSUE_NUMBER}" ]; then
            args+=(--issue-number "${ISSUE_NUMBER}")
          fi
          python3 scripts/harness/flow.py issue-watch "${args[@]}"
