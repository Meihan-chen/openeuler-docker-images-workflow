name: Watch GitCode new-image Issues

on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Exact GitCode Issue number; defaults to repository variable"
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: phase1-gitcode-issue-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Claim one new image request
    if: >-
      ${{ inputs.issue_number != '' ||
          vars.PHASE1_TEST_ISSUE_NUMBER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Require the phase-one Issue allowlist
        env:
          ISSUE_NUMBER: >-
            ${{ inputs.issue_number || vars.PHASE1_TEST_ISSUE_NUMBER }}
        run: |
          case "${ISSUE_NUMBER}" in
            ''|*[!0-9]*|0)
              echo "PHASE1_TEST_ISSUE_NUMBER must be a positive integer" >&2
              exit 2
              ;;
          esac

      - name: Claim Issue and dispatch scenario one
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: >-
            ${{ inputs.issue_number || vars.PHASE1_TEST_ISSUE_NUMBER }}
        run: |
          python3 scripts/harness/flow.py \
            issue-watch \
            --target-repo openeuler/openeuler-docker-images \
            --issue-number "${ISSUE_NUMBER}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-ref "${GITHUB_REF_NAME}"
