name: New Image

# Triggered by GitCode Issue with [new-image] label or manually via workflow_dispatch.
# Standalone: adversarial pairs, then build+test+fix loop (3 rounds), then PR.

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      package:
        description: 'App name'
        required: true
        default: 'nginx'
      source:
        description: 'Upstream repo URL'
        required: true
        default: 'https://github.com/nginx/nginx'
      domain:
        description: 'Domain dir'
        required: true
        default: 'Cloud'
      os_version:
        description: 'openEuler version'
        required: true
        default: '24.03-lts'
      app_version:
        description: 'App version'
        required: true
        default: '1.27.2'

env:
  PYTHONUNBUFFERED: "1"

jobs:
  triage:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.issue.labels.*.name, 'new-image') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      package: ${{ steps.set.outputs.package }}
      source: ${{ steps.set.outputs.source }}
      domain: ${{ steps.set.outputs.domain }}
      os_version: ${{ steps.set.outputs.os_version }}
      app_version: ${{ steps.set.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "package=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
            echo "source=${{ inputs.source }}" >> "$GITHUB_OUTPUT"
            echo "domain=${{ inputs.domain }}" >> "$GITHUB_OUTPUT"
            echo "os_version=${{ inputs.os_version }}" >> "$GITHUB_OUTPUT"
            echo "app_version=${{ inputs.app_version }}" >> "$GITHUB_OUTPUT"
          else
            python scripts/harness/parse_issue.py "${{ github.event.issue.body }}" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: triage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create files
        env:
          PACKAGE: ${{ needs.triage.outputs.package }}
          APP_VERSION: ${{ needs.triage.outputs.app_version }}
          DOMAIN: ${{ needs.triage.outputs.domain }}
          OS_VERSION: ${{ needs.triage.outputs.os_version }}
        run: python scripts/harness/create_demo.py

      - name: Validate meta
        continue-on-error: true
        run: python scripts/harness/validate_meta.py || echo "::warning::meta validation found issues — will be fixed by Fixer"

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-files
          path: |
            **/Dockerfile
            **/meta.yml
            **/README.md
            **/doc/**
            **/tests/**
            **/image-list.yml
            **/ai-result.json
            **/test-ai-result.json
            **/logo.png

  verify-r1:
    needs: generate
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: ${{ vars.RUNNER_X64 || 'ubuntu-latest' }}
            platform: linux/amd64
          - runner: ${{ vars.RUNNER_ARM64 || 'ubuntu-latest' }}
            platform: linux/arm64
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-files

      - name: Build
        id: build
        env:
          APP: ${{ needs.triage.outputs.package }}
        continue-on-error: ${{ !vars.RUNNER_X64 }}
        run: |
          set -o pipefail
          docker buildx build --platform ${{ matrix.arch.platform }} \
            --tag "openeuler/${APP}:test" --load . 2>&1 | tee /tmp/build-r1-${{ matrix.arch.platform }}.log

      - name: Test
        if: steps.build.outcome == 'success'
        env:
          APP: ${{ needs.triage.outputs.package }}
        run: python scripts/harness/run.py test --app "$APP" --platform ${{ matrix.arch.platform }}

      - name: Record skipped test
        if: steps.build.outcome != 'success'
        run: |
          mkdir -p results/latest/${{ matrix.arch.platform }}
          echo '<?xml version="1.0"?><testsuite name="skipped" tests="0" failures="0"/>' > results/latest/${{ matrix.arch.platform }}/${{ matrix.arch.platform }}.junit.xml
          echo "Build skipped (no openEuler runner) — test marked as N/A" | tee /tmp/build-r1-${{ matrix.arch.platform }}.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-r1-${{ matrix.arch.platform }}
          path: |
            /tmp/build-r1-${{ matrix.arch.platform }}.log
            **/results/**/*.junit.xml

  fix-r1:
    needs: verify-r1
    if: failure() && vars.RUNNER_X64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-r1-*
          merge-multiple: true
      - env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/harness/run.py fix

  verify-r2:
    needs: fix-r1
    if: always() && !failure()
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: ${{ vars.RUNNER_X64 || 'ubuntu-latest' }}
            platform: linux/amd64
          - runner: ${{ vars.RUNNER_ARM64 || 'ubuntu-latest' }}
            platform: linux/arm64
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build-r2
        env:
          APP: ${{ needs.triage.outputs.package }}
        continue-on-error: ${{ !vars.RUNNER_X64 }}
        run: |
          set -o pipefail
          docker buildx build --platform ${{ matrix.arch.platform }} \
            --tag "openeuler/${APP}:test" --load . 2>&1 | tee /tmp/build-r2-${{ matrix.arch.platform }}.log

      - name: Test
        if: steps.build-r2.outcome == 'success'
        env:
          APP: ${{ needs.triage.outputs.package }}
        run: python scripts/harness/run.py test --app "$APP" --platform ${{ matrix.arch.platform }}

      - name: Record skipped test
        if: steps.build-r2.outcome != 'success'
        run: |
          mkdir -p results/latest/${{ matrix.arch.platform }}
          echo '<?xml version="1.0"?><testsuite name="skipped" tests="0" failures="0"/>' > results/latest/${{ matrix.arch.platform }}/${{ matrix.arch.platform }}.junit.xml
          echo "Build skipped (no openEuler runner)" | tee /tmp/build-r2-${{ matrix.arch.platform }}.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-r2-${{ matrix.arch.platform }}
          path: |
            /tmp/build-r2-${{ matrix.arch.platform }}.log
            **/results/**/*.junit.xml

  fix-r2:
    needs: verify-r2
    if: failure() && vars.RUNNER_X64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-r2-*
          merge-multiple: true
      - env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/harness/run.py fix

  verify-r3:
    needs: fix-r2
    if: always() && !failure()
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: ${{ vars.RUNNER_X64 || 'ubuntu-latest' }}
            platform: linux/amd64
          - runner: ${{ vars.RUNNER_ARM64 || 'ubuntu-latest' }}
            platform: linux/arm64
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build-r3
        env:
          APP: ${{ needs.triage.outputs.package }}
        continue-on-error: ${{ !vars.RUNNER_X64 }}
        run: |
          set -o pipefail
          docker buildx build --platform ${{ matrix.arch.platform }} \
            --tag "openeuler/${APP}:test" --load . 2>&1 | tee /tmp/build-r3-${{ matrix.arch.platform }}.log

      - name: Test
        if: steps.build-r3.outcome == 'success'
        env:
          APP: ${{ needs.triage.outputs.package }}
        run: python scripts/harness/run.py test --app "$APP" --platform ${{ matrix.arch.platform }}

      - name: Record skipped test
        if: steps.build-r3.outcome != 'success'
        run: |
          mkdir -p results/latest/${{ matrix.arch.platform }}
          echo '<?xml version="1.0"?><testsuite name="skipped" tests="0" failures="0"/>' > results/latest/${{ matrix.arch.platform }}/${{ matrix.arch.platform }}.junit.xml
          echo "Build skipped (no openEuler runner)" | tee /tmp/build-r3-${{ matrix.arch.platform }}.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-r3-${{ matrix.arch.platform }}
          path: |
            /tmp/build-r3-${{ matrix.arch.platform }}.log
            **/results/**/*.junit.xml

  fix-r3:
    needs: verify-r3
    if: failure() && vars.RUNNER_X64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-r3-*
          merge-multiple: true
      - env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/harness/run.py fix

  needs-human:
    needs: [verify-r1, verify-r2, verify-r3, fix-r3]
    if: always() && failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "3 fix rounds exhausted, still failing"
          echo "See test-results-r1/r2/r3 artifacts for full diagnostic trail"

  compose-pr:
    needs: [triage, generate, verify-r1, verify-r2, verify-r3]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-r*
          merge-multiple: true

      - name: Diff check
        run: python scripts/harness/gate_diff.py

      - name: Compose PR body
        env:
          PACKAGE: ${{ needs.triage.outputs.package }}
          APP_VERSION: ${{ needs.triage.outputs.app_version }}
          OS_VERSION: ${{ needs.triage.outputs.os_version }}
        run: |
          python scripts/harness/compose_pr.py --scenario new-image
          echo "=== PR Title ===" && cat /tmp/pr-title
          echo "=== PR Body (first 20 lines) ===" && head -20 /tmp/pr-body.md

      - name: Create branch and commit
        id: branch
        env:
          PACKAGE: ${{ needs.triage.outputs.package }}
          APP_VERSION: ${{ needs.triage.outputs.app_version }}
        run: |
          BRANCH="auto/${PACKAGE}-${APP_VERSION}-$(date +%Y%m%d%H%M%S)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "openeuler-bot"
          git config user.email "bot@openeuler.org"
          git checkout -b "$BRANCH"
          git add -A
          git diff --cached --stat
          git commit -m "[new-image] Add ${PACKAGE} ${APP_VERSION} container image" || echo "nothing to commit"

      - name: Push and create PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git push origin "$BRANCH" 2>&1 || echo "push failed (may already exist)"
          gh pr create \
            --title "$(cat /tmp/pr-title)" \
            --body-file /tmp/pr-body.md \
            --head "$BRANCH" \
            --base main \
            --label "auto-generated" 2>&1 || echo "PR creation failed — check if PR already exists"