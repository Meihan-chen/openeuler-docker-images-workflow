name: New Image

# Triggered by GitCode Issue with [new-image] label.
# Standalone: runs adversarial pairs, then build+test+fix loop (3 rounds), then PR.

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      package:
        description: 'App name'
        required: true
        default: 'nginx'
      source:
        description: 'Upstream repo URL'
        required: true
        default: 'https://github.com/nginx/nginx'
      domain:
        description: 'Domain dir'
        required: true
        default: 'Cloud'
      os_version:
        description: 'openEuler version'
        required: true
        default: '24.03-lts'
      app_version:
        description: 'App version'
        required: true
        default: '1.27.2'

env:
  PYTHONUNBUFFERED: "1"

jobs:
  triage:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.issue.labels.*.name, 'new-image') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      package: ${{ steps.set.outputs.package }}
      source: ${{ steps.set.outputs.source }}
      domain: ${{ steps.set.outputs.domain }}
      os_version: ${{ steps.set.outputs.os_version }}
      app_version: ${{ steps.set.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "package=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
            echo "source=${{ inputs.source }}" >> "$GITHUB_OUTPUT"
            echo "domain=${{ inputs.domain }}" >> "$GITHUB_OUTPUT"
            echo "os_version=${{ inputs.os_version }}" >> "$GITHUB_OUTPUT"
            echo "app_version=${{ inputs.app_version }}" >> "$GITHUB_OUTPUT"
          else
            python scripts/harness/parse_issue.py "${{ github.event.issue.body }}" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: triage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image Creator + QA (adversarial pair 1)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PACKAGE: ${{ needs.triage.outputs.package }}
          SOURCE: ${{ needs.triage.outputs.source }}
          DOMAIN: ${{ needs.triage.outputs.domain }}
          OS_VERSION: ${{ needs.triage.outputs.os_version }}
          APP_VERSION: ${{ needs.triage.outputs.app_version }}
        run: python scripts/harness/run.py adversarial-pair --role image

      - name: Testcase Creator + QA (adversarial pair 2)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/harness/run.py adversarial-pair --role testcase

      - name: Validate meta
        run: python scripts/harness/validate_meta.py

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-files
          path: |
            */**/Dockerfile
            */meta.yml
            */README.md
            */doc/
            */tests/

  # --- Round 1: build + test ---
  verify-r1:
    needs: generate
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: [self-hosted, Linux, x64]
            platform: linux/amd64
          - runner: [self-hosted, Linux, ARM64]
            platform: linux/arm64
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: generated-files }

      - name: Build
        run: |
          set -o pipefail
          docker buildx build --platform ${{ matrix.arch.platform }} \
            --tag "openeuler/${APP}:test" --load . 2>&1 | tee /tmp/build-r1-${{ matrix.arch.platform }}.log
        env: { APP: ${{ needs.triage.outputs.package }} }

      - name: Test
        run: python scripts/harness/run.py test --app "$APP" --platform ${{ matrix.arch.platform }}
        env: { APP: ${{ needs.triage.outputs.package }} }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-r1-${{ matrix.arch.platform }}
          path: |
            /tmp/build-r1-${{ matrix.arch.platform }}.log
            **/results/**/*.junit.xml

  # --- Fix round 1 ---
  fix-r1:
    needs: verify-r1
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: test-results-r1-*, merge-multiple: true }
      - run: python scripts/harness/run.py fix
        env: { ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} }

  # --- Round 2: re-build + re-test (fixer changes applied) ---
  verify-r2:
    needs: fix-r1
    if: always() && !failure()
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: [self-hosted, Linux, x64]
            platform: linux/amd64
          - runner: [self-hosted, Linux, ARM64]
            platform: linux/arm64
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -o pipefail
          docker buildx build --platform ${{ matrix.arch.platform }} \
            --tag "openeuler/${APP}:test" --load . 2>&1 | tee /tmp/build-r2-${{ matrix.arch.platform }}.log
        env: { APP: ${{ needs.triage.outputs.package }} }

      - name: Test
        run: python scripts/harness/run.py test --app "$APP" --platform ${{ matrix.arch.platform }}
        env: { APP: ${{ needs.triage.outputs.package }} }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-r2-${{ matrix.arch.platform }}
          path: |
            /tmp/build-r2-${{ matrix.arch.platform }}.log
            **/results/**/*.junit.xml

  # --- Fix round 2 ---
  fix-r2:
    needs: verify-r2
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: test-results-r2-*, merge-multiple: true }
      - run: python scripts/harness/run.py fix
        env: { ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} }

  # --- Round 3: re-build + re-test ---
  verify-r3:
    needs: fix-r2
    if: always() && !failure()
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: [self-hosted, Linux, x64]
            platform: linux/amd64
          - runner: [self-hosted, Linux, ARM64]
            platform: linux/arm64
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -o pipefail
          docker buildx build --platform ${{ matrix.arch.platform }} \
            --tag "openeuler/${APP}:test" --load . 2>&1 | tee /tmp/build-r3-${{ matrix.arch.platform }}.log
        env: { APP: ${{ needs.triage.outputs.package }} }

      - name: Test
        run: python scripts/harness/run.py test --app "$APP" --platform ${{ matrix.arch.platform }}
        env: { APP: ${{ needs.triage.outputs.package }} }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-r3-${{ matrix.arch.platform }}
          path: |
            /tmp/build-r3-${{ matrix.arch.platform }}.log
            **/results/**/*.junit.xml

  # --- Fix round 3 (last attempt, no re-verify after this) ---
  fix-r3:
    needs: verify-r3
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: test-results-r3-*, merge-multiple: true }
      - run: python scripts/harness/run.py fix
        env: { ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} }

  needs-human:
    needs: [verify-r1, verify-r2, verify-r3, fix-r3]
    if: always() && failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "3 fix rounds exhausted, still failing"
          echo "See test-results-r1/r2/r3 artifacts for full diagnostic trail"

  compose-pr:
    needs: [verify-r1, verify-r2, verify-r3]
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: test-results-r*, merge-multiple: true }
      - run: python scripts/harness/gate_diff.py
      - run: python scripts/harness/compose_pr.py --scenario new-image
        env: { GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }} }
      - run: |
          python scripts/utils/gitcode.py pr create \
            --title "$(cat /tmp/pr-title)" \
            --body-file /tmp/pr-body.md \
            --head "$(git branch --show-current)"
        env: { GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }} }