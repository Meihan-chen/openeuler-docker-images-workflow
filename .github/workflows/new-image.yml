name: New Image

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      package:
        description: 'App name'
        required: true
        default: 'nginx'
      source:
        description: 'Upstream repo URL'
        required: true
        default: 'https://github.com/nginx/nginx'
      domain:
        description: 'Domain dir'
        required: true
        default: 'Cloud'
      os_version:
        description: 'openEuler version'
        required: true
        default: '24.03-lts'
      app_version:
        description: 'App version'
        required: true
        default: '1.27.2'
      demo_mode:
        description: 'Skip LLM agents, use create_demo.py (for testing pipeline without API key)'
        required: false
        type: boolean
        default: false

env:
  PYTHONUNBUFFERED: "1"
  TARGET_REPO: openeuler/openeuler-docker-images
  TARGET_REPO_HOST: gitcode.com

jobs:
  run:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.issue.labels.*.name, 'new-image') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU (arm64)
        uses: docker/setup-qemu-action@v3
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Run flow
        id: flow
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          python scripts/harness/flow.py \
            --app "${{ inputs.package || github.event.issue.body.package }}" \
            --version "${{ inputs.app_version || '1.27.2' }}" \
            --os "${{ inputs.os_version || '24.03-lts' }}" \
            --domain "${{ inputs.domain || 'Cloud' }}" \
            ${{ inputs.demo_mode == true && '--demo' || '' }}

      - name: Show PR URL
        if: always()
        run: |
          if [ -f /tmp/pr-url ]; then
            echo "PR: $(cat /tmp/pr-url)"
          else
            echo "No PR created (all attempts failed or issue filed)"
          fi