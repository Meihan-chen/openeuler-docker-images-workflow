name: Create New Images
run-name: >-
  ${{ inputs.operation }} / ${{ inputs.app }} ${{ inputs.version }} /
  ${{ inputs.os_version }}

# Operator-facing entry for the new-image pipeline. It owns dispatch inputs
# only; every job lives in the shared spine so the diagnostic entries
# (existing_as_new_probe.yml, issue_contract_test.yml) cannot drift from it.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Explicit phase-one operation"
        required: true
        type: choice
        default: pipeline_smoke
        options:
          - pipeline_smoke
          - validate_only
          - scenario_one
          - resume
          - fork_pr
      source_run_id:
        description: "Resume Run ID, or Issue number as issue:<number>"
        required: false
        type: string
      resume_from:
        description: "Round 1-4, or 'package', that resume restarts from"
        required: false
        default: "1"
        type: string
      validated_run_id:
        description: "Candidate run ID required by fork_pr"
        required: false
        type: string
      allow_diagnostic_candidate:
        description: >-
          fork_pr: deliver a resume candidate (promotable=false, diagnostic)
        required: false
        default: false
        type: boolean
      app:
        description: "Application name"
        required: true
        type: string
        default: kvrocks
      version:
        description: "Application version"
        required: true
        type: string
        default: 2.16.0
      os_version:
        description: "openEuler version"
        required: true
        type: string
        default: 24.03-lts-sp4
      domain:
        description: "Target repository domain"
        required: true
        type: string
        default: Database
      source_url:
        description: "Pinned upstream release URL"
        required: true
        type: string
        default: https://github.com/apache/kvrocks/tree/v2.16.0

permissions:
  actions: read
  contents: read

jobs:
  create-new-image:
    name: Create new image
    uses: ./.github/workflows/_create_new_image_pipeline.yml
    with:
      operation: ${{ inputs.operation }}
      source_run_id: ${{ inputs.source_run_id }}
      resume_from: ${{ inputs.resume_from }}
      validated_run_id: ${{ inputs.validated_run_id }}
      allow_diagnostic_candidate: ${{ inputs.allow_diagnostic_candidate }}
      app: ${{ inputs.app }}
      version: ${{ inputs.version }}
      os_version: ${{ inputs.os_version }}
      domain: ${{ inputs.domain }}
      source_url: ${{ inputs.source_url }}
    secrets:
      # Empty strings are falsy in GitHub expressions, so the safe form tests
      # the non-smoke branch before selecting the secret.
      DEEPSEEK_API_KEY: >-
        ${{ inputs.operation != 'pipeline_smoke' &&
        secrets.DEEPSEEK_API_KEY || '' }}
      GITCODE_TOKEN: >-
        ${{ (inputs.operation == 'scenario_one' ||
        inputs.operation == 'fork_pr') && secrets.GITCODE_TOKEN || '' }}
