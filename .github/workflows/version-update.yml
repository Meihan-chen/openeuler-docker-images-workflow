name: Version Update

# Triggered by anitya webhook (repository_dispatch) or manual workflow_dispatch.
# 1. Query anitya for apps with new upstream versions
# 2. For each app: call verify.yml (build + test)
# 3. If verify fails: run fixer, re-verify (up to 3 rounds)
# 4. Create PR for successfully verified apps

on:
  repository_dispatch:
    types: [anitya-version-update]
  workflow_dispatch:
    inputs:
      app:
        description: 'Specific app to update (blank = all)'
        required: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  query:
    runs-on: [self-hosted, Linux, x64]
    outputs:
      updates: ${{ steps.q.outputs.updates }}
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: |
          UPDATES=$(python scripts/harness/query_version.py \
            ${%-%github.event.inputs.app%} --format json)
          echo "updates=$UPDATES" >> "$GITHUB_OUTPUT"

  # --- Per-app verify + fix ---
  verify:
    needs: query
    if: needs.query.outputs.updates != '[]'
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.MAX_PARALLEL_IMAGES || 4 }}
      matrix:
        app: ${{ fromJSON(needs.query.outputs.updates) }}
    uses: ./.github/workflows/verify.yml
    with:
      app: ${{ matrix.app.name }}
      app_version: ${{ matrix.app.version }}
      os_version: ${{ matrix.app.os_version }}
      scenario: version-update

  fix-r1:
    needs: verify
    if: failure()
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.MAX_PARALLEL_IMAGES || 4 }}
      matrix:
        app: ${{ fromJSON(needs.query.outputs.updates) }}
    runs-on: [self-hosted, Linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-${{ matrix.app.name }}-*
          merge-multiple: true
      - env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/harness/run.py fix

  verify-r2:
    needs: fix-r1
    if: always() && !failure()
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.MAX_PARALLEL_IMAGES || 4 }}
      matrix:
        app: ${{ fromJSON(needs.query.outputs.updates) }}
    uses: ./.github/workflows/verify.yml
    with:
      app: ${{ matrix.app.name }}
      app_version: ${{ matrix.app.version }}
      os_version: ${{ matrix.app.os_version }}
      scenario: version-update
      retry: true

  fix-r2:
    needs: verify-r2
    if: failure()
    strategy:
      matrix:
        app: ${{ fromJSON(needs.query.outputs.updates) }}
    runs-on: [self-hosted, Linux, x64]
    steps:
      - uses: actions/checkout@v4
      - env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/harness/run.py fix

  verify-r3:
    needs: fix-r2
    if: always() && !failure()
    strategy:
      matrix:
        app: ${{ fromJSON(needs.query.outputs.updates) }}
    uses: ./.github/workflows/verify.yml
    with:
      app: ${{ matrix.app.name }}
      app_version: ${{ matrix.app.version }}
      os_version: ${{ matrix.app.os_version }}
      scenario: version-update
      retry: true
  # --- End per-app verify + fix ---

  compose-pr:
    needs: [verify, verify-r2, verify-r3]
    if: always() && !failure()
    runs-on: [self-hosted, Linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: test-results-*, merge-multiple: true }
      - run: python scripts/harness/gate_diff.py
      - env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: python scripts/harness/compose_pr.py --scenario version-update
      - env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          python scripts/utils/gitcode.py pr create \
            --title "$(cat /tmp/pr-title)" \
            --body-file /tmp/pr-body.md \
            --head "$(git branch --show-current)"